<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resonate — Music Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================================================
       AUTH VIEW  (shown when logged out)
       ============================================================ -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth__art" aria-hidden="true">
      <div class="auth__bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="auth__tag">A small streaming app on a real database.</p>
    </div>

    <div class="auth__panel">
      <div class="brand brand--lg">
        <span class="brand__mark">◆</span>
        <span class="brand__name">Resonate</span>
      </div>

      <div class="auth__tabs">
        <button class="auth__tab is-active" data-auth-tab="login">Sign in</button>
        <button class="auth__tab" data-auth-tab="register">Create account</button>
      </div>

      <!-- Login form -->
      <form id="login-form" class="auth__form">
        <label class="field">
          <span class="field__label">Email</span>
          <input name="email" type="email" autocomplete="email" placeholder="alice@example.com" required />
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <button type="submit" class="btn btn--primary btn--block">Sign in</button>
        <p class="auth__hint">Demo: <code>alice@example.com</code> / <code>password123</code></p>
      </form>

      <!-- Register form -->
      <form id="register-form" class="auth__form" hidden>
        <label class="field">
          <span class="field__label">Email</span>
          <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label class="field">
          <span class="field__label">Username</span>
          <input name="username" type="text" autocomplete="username" placeholder="yourname" required />
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field__label">Password</span>
            <input name="password" type="password" autocomplete="new-password" placeholder="••••••••" required />
          </label>
          <label class="field field--narrow">
            <span class="field__label">Country</span>
            <input name="country" type="text" maxlength="2" placeholder="SG" />
          </label>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Create account</button>
        <p class="auth__hint">A Free subscription is added automatically on signup.</p>
      </form>
    </div>
  </section>

  <!-- ============================================================
       APP SHELL  (shown when logged in)
       ============================================================ -->
  <div id="app-shell" class="shell" hidden>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand__mark">◆</span>
        <span class="brand__name">Resonate</span>
      </div>

      <nav class="nav">
        <a class="nav__link" href="#/browse" data-route="browse">
          <span class="nav__icon">⌕</span> Browse
        </a>
        <a class="nav__link" href="#/playlists" data-route="playlists">
          <span class="nav__icon">≡</span> My Playlists
        </a>
        <a class="nav__link" href="#/recommend" data-route="recommend">
          <span class="nav__icon">✶</span> For You
        </a>
        <a class="nav__link" href="#/stats" data-route="stats">
          <span class="nav__icon">▤</span> Charts
        </a>
      </nav>

      <div class="sidebar__foot">
        <div class="userchip">
          <div class="userchip__avatar" id="user-avatar">A</div>
          <div class="userchip__meta">
            <span class="userchip__name" id="user-name">—</span>
            <span class="userchip__plan" id="user-plan">Free plan</span>
          </div>
        </div>
        <button id="logout-btn" class="btn btn--ghost btn--sm btn--block">Sign out</button>
      </div>
    </aside>

    <!-- Main column -->
    <main class="main">
      <header class="topbar">
        <div class="search">
          <span class="search__icon">⌕</span>
          <input id="search-input" type="search" placeholder="Search tracks, artists, albums…" autocomplete="off" />
        </div>
        <div id="genre-chips" class="chips" aria-label="Filter by genre"></div>
      </header>

      <div id="view-root" class="view-root">
        <!-- Views render here -->
      </div>
    </main>

    <!-- Persistent now-playing bar (signature element) -->
    <footer id="player" class="player" data-empty="true">
      <div class="player__now">
        <div class="player__cover" id="player-cover" aria-hidden="true">♪</div>
        <div class="player__meta">
          <span class="player__title" id="player-title">Nothing playing</span>
          <span class="player__artist" id="player-artist">Pick a track to start</span>
        </div>
      </div>

      <div class="player__controls">
        <button id="player-toggle" class="player__btn" aria-label="Play or pause" disabled>▶</button>
        <div class="eq" id="player-eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="player__data">
        <span class="player__data-label">play_count</span>
        <span class="player__data-value" id="player-playcount">—</span>
      </div>
    </footer>
  </div>

  <!-- Toasts -->
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
